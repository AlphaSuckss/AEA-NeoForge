plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}+neoforge-${minecraft_version}"
group = 'dev.alphasucks.aea'
base { archivesName = 'aea' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        aea {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // TaCZ, Spell Engine and AppleSkin, for the optional compat in compat/.
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Put Overgrown's jars in libs/ (apoli-1.124.0.jar, origins-1.49.0.jar).
    implementation files('libs/apoli-1.124.0.jar')
    // Origins is optional at runtime and AEA never imports it; compile against it only.
    compileOnly files('libs/origins-1.49.0.jar')
    // Optional: AEA only touches these when the mod is installed.
    compileOnly 'maven.modrinth:SzzJttH8:tJiZL0He'                   // TaCZ 1.2.0-hotfix
    compileOnly 'maven.modrinth:spell-engine:1.10.9+1.21.1-neoforge'
    compileOnly 'maven.modrinth:spell-power:1.6.0+1.21.1-neoforge'
    compileOnly 'maven.modrinth:appleskin:3.0.9+mc1.21'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest.attributes(
        'Implementation-Title': 'AEA',
        'Implementation-Version': project.mod_version
    )
}
