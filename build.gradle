plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${mod_version}+neoforge-${minecraft_version}"
group = 'dev.alphasucks.aea'
base { archivesName = 'aea' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The port's smoke tests (/aea selftest). Not part of the release jar; see selftestJar and the server run.
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            // Dev server with the self-tests on: /aea selftest grants every power to a test mob. Never ship a server with this on.
            sourceSet = sourceSets.selftest
            systemProperty 'aea.selftest', 'true'
        }
    }
    mods {
        aea {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

dependencies {
    // Put Overgrown's jars in libs/ (apoli-1.124.0.jar, origins-1.49.0.jar).
    implementation files('libs/apoli-1.124.0.jar')
    // Origins is optional at runtime and AEA never imports it; compile against it only.
    compileOnly files('libs/origins-1.49.0.jar')
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// aea-<version>-selftest.jar: the release jar plus the self-tests.
tasks.register('selftestJar', Jar) {
    archiveClassifier = 'selftest'
    manifest.from(tasks.jar.manifest)
    from sourceSets.main.output
    from sourceSets.selftest.output
}
